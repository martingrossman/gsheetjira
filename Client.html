<script>
(() => {
  'use strict';
  const C = TrackerCore;
  const $ = selector => document.querySelector(selector);
  const $$ = selector => [...document.querySelectorAll(selector)];
  const escape = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const icons = {
    sheet: '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M3 15h18M9 9v12"/>',
    board: '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18M15 3v18M6 7v5M12 7v9M18 7v3"/>',
    timeline: '<path d="M4 4v16h17M8 6h7M11 11h9M7 16h7"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    search: '<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',
    refresh: '<path d="M20 7v5h-5M4 17v-5h5M5.6 8a7 7 0 0 1 12-3l2.4 3M4 16l2.4 3a7 7 0 0 0 12-3"/>',
    download: '<path d="M12 3v12m-5-5 5 5 5-5M4 15v5h16v-5"/>',
    help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 .5c0 2-2.5 2-2.5 4M12 17h.01"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4M17 3v4M3 11h18"/>',
    check: '<path d="m5 12 4 4L19 6"/>',
    circle: '<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/>',
    stack: '<path d="m12 3 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/>',
    flag: '<path d="M5 21V4c4-5 10 5 14 0v10c-4 5-10-5-14 0"/>'
  };
  const icon = name => `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name] || icons.circle}</svg>`;
  $$('[data-icon]').forEach(el => el.innerHTML = icon(el.dataset.icon));
  const typeColors = { Epic: '#a28aba', Story: '#8baa78', Task: '#7da3b8', Bug: '#c58d7b' };
  const statusColors = ['#9da58f', '#a5a1bd', '#759bb5', '#c3a469', '#83a375'];
  const statusBg = ['#f0f2eb', '#efedf6', '#eaf1f6', '#f7f1e4', '#edf4e8'];
  const typeIcon = type => `<span class="type-icon" style="--type-color:${typeColors[type] || '#8b9b83'}" title="${escape(type)}">${({ Epic: 'ϟ', Story: '▮', Task: '✓', Bug: '•' })[type] || '•'}</span>`;
  const today = () => { const d = new Date(); return [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-'); };
  const shortDate = value => C.validDate(value) ? new Date(value + 'T12:00:00Z').toLocaleDateString('en-GB', { month: 'short', day: 'numeric', timeZone: 'UTC' }) : 'No date';
  const timestamp = value => value && Number.isFinite(Date.parse(value)) ? new Date(value).toLocaleString() : '—';
  const initials = name => name.split(/\s+/).filter(Boolean).slice(0, 2).map(s => s[0]).join('').toUpperCase();
  function avatar(name) {
    const colors = ['#e1e9d3', '#eaded0', '#d8e6e9', '#e5dfeb'];
    return `<span class="avatar ${name ? '' : 'unassigned'}" title="${escape(name || 'Unassigned')}" style="--avatar-bg:${colors[[...name].reduce((a, c) => a + c.charCodeAt(0), 0) % colors.length]}">${escape(name ? initials(name) : '?')}</span>`;
  }
  const isCloud = !!(window.google && google.script && google.script.run);
  const storageKey = 'sheetflow.project.v1';
  const draftStorageKey = 'sheetflow.pending-drafts.v1';
  const state = { issues: [], settings: [], drafts: {}, quickQueue: [], ready: false, busy: false, view: 'kanban', query: '', type: '', assignee: '', status: '', sprint: '', epic: '', sort: 'rank', ascending: true, allColumns: false, timelineStart: C.addDays(today(), -7), zoom: 'weeks', spreadsheetUrl: '' };
  let edited = null, initialForm = '', draggingId = null, timelineDrag = null, suppressClickUntil = 0, toastTimer;
  const form = $('#issue-form'), dialog = $('#issue-dialog');
  try { state.drafts = JSON.parse(localStorage.getItem(draftStorageKey) || '{}') || {}; } catch (ignore) { state.drafts = {}; }
  function draftKey(input) { return input?.id || '__new__'; }
  function saveDraft(input, version) {
    const key = draftKey(input); if (!key) return;
    state.drafts[key] = { input: { ...input }, version, savedAt: new Date().toISOString() };
    localStorage.setItem(draftStorageKey, JSON.stringify(state.drafts));
  }
  function clearDraft(id) {
    const key = id || '__new__'; if (!state.drafts[key]) return;
    delete state.drafts[key]; localStorage.setItem(draftStorageKey, JSON.stringify(state.drafts));
  }
  function withDraft(issue) {
    const draft = issue && state.drafts[issue.id]; return draft ? { ...issue, ...draft.input } : issue;
  }
  function activityTypes() {
    const configured = state.settings.filter(setting => setting.category === 'taskType' && setting.active !== false).sort((a, b) => a.order - b.order);
    return configured.length ? configured.map(setting => ({ value: setting.valueType === 'json' ? setting.key : setting.value, label: setting.valueType === 'json' ? setting.value : setting.key })) : [{ value: 'algo', label: 'Algo' }, { value: 'data', label: 'Data' }, { value: 'requirements', label: 'Requirements' }, { value: 'bug', label: 'Bug' }];
  }
  function getLocal() {
    const raw = localStorage.getItem(storageKey);
    if (raw === null) {
      const issues = C.sample(today()).map(i => ({ ...i, version: crypto.randomUUID() }));
      const db = { issues, sequence: issues.length };
      localStorage.setItem(storageKey, JSON.stringify(db));
      return db;
    }
    const db = JSON.parse(raw);
    if (!db || !Array.isArray(db.issues) || !Number.isInteger(db.sequence)) throw new Error('The browser project could not be read. Export or back up this browser’s storage before repairing it.');
    const seen = new Set();
    for (const issue of db.issues) {
      if (!issue.id || seen.has(issue.id)) throw new Error('Browser project contains missing or duplicate IDs.');
      seen.add(issue.id); C.validate(issue, db.issues);
    }
    return db;
  }
  async function rpc(method, ...args) {
    if (isCloud) return new Promise((resolve, reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(error => reject(new Error(error.message || String(error))))[method](...args));
    const db = getLocal();
    if (method === 'getProject') return { issues: db.issues, spreadsheetUrl: '', name: 'Sample project' };
    if (method === 'saveIssue') {
      const [input, version] = args;
      const current = db.issues.find(i => i.id === input.id);
      if (input.id && !current) throw new Error('This issue was deleted elsewhere. Refresh the project.');
      if (current && current.version !== version) throw new Error('This issue changed elsewhere. Refresh, then apply your changes again.');
      const issue = C.prepare(input, current, today(), new Date().toISOString());
      if (!current) { db.sequence = Math.max(db.sequence, ...db.issues.map(i => Number(/^PRJ-(\d+)$/.exec(i.id)?.[1]) || 0)); issue.id = 'PRJ-' + (++db.sequence); }
      C.validate(issue, db.issues); issue.version = crypto.randomUUID();
      db.issues = current ? db.issues.map(i => i.id === issue.id ? issue : i) : [...db.issues, issue];
      localStorage.setItem(storageKey, JSON.stringify(db));
      return issue;
    }
    if (method === 'deleteIssue') {
      const issue = db.issues.find(i => i.id === args[0]);
      if (!issue || issue.version !== args[1]) throw new Error('This issue changed elsewhere. Refresh before deleting.');
      C.canDelete(issue.id, db.issues); db.issues = db.issues.filter(i => i.id !== issue.id);
      localStorage.setItem(storageKey, JSON.stringify(db)); return { id: issue.id };
    }
    throw new Error('Unknown operation.');
  }
  function notify(message, error = false) {
    clearTimeout(toastTimer); const el = $('#toast'); el.textContent = message; el.classList.toggle('error', error); el.hidden = false;
    toastTimer = setTimeout(() => el.hidden = true, error ? 7000 : 2800);
  }
  function syncText(text, error = false) { $('#sync-status').textContent = text; $('#sync-status').classList.toggle('error', error); }
  function setBusy(value) {
    state.busy = value; document.body.classList.toggle('busy', value);
    $$('#issue-form input, #issue-form select, #issue-form textarea, #issue-form button').forEach(el => el.disabled = value);
    $('#refresh').disabled = value; $('#create-issue').disabled = value || !state.ready; $('#add-epic').disabled = value || !state.ready;
  }
  function showError(error) {
    $('#error-banner').innerHTML = `${escape(error.message || String(error))} <button class="button subtle" id="retry-save" type="button">Retry</button>`; $('#error-banner').hidden = false;
    $('#retry-save')?.addEventListener('click', async () => {
      const draft = Object.values(state.drafts)[0]; if (!draft) return;
      try { await persist(draft.input, draft.version, 'Issue saved'); } catch (ignore) {}
    });
    syncText('Could not sync', true);
  }
  async function refresh(quiet = false) {
    if (state.busy || timelineDrag) return;
    setBusy(true); if (!quiet) syncText('Loading…');
    try {
      const project = await rpc('getProject'); state.issues = project.issues.map(withDraft); state.settings = project.settings || []; state.spreadsheetUrl = project.spreadsheetUrl; state.ready = true;
      $('#error-banner').hidden = true;
      $('#connection-title').textContent = isCloud ? 'Connected to Google Sheets' : 'Browser demo';
      $('#connection-detail').textContent = isCloud ? 'Shared data. Three ways to work.' : 'Sample data saved on this browser.';
      $('#sheet-link').hidden = !project.spreadsheetUrl;
      if (project.spreadsheetUrl && /^https:\/\/docs.google.com\/spreadsheets\//.test(project.spreadsheetUrl)) $('#sheet-link').href = project.spreadsheetUrl;
      syncText(isCloud ? 'Synced with Sheets' : 'Saved in this browser');
      render();
    } catch (error) {
      showError(error);
      if (!state.ready) $('#view-content').innerHTML = `<div class="empty-state"><h2>Let’s connect your project</h2><p>${escape(error.message)}</p><button class="button primary" id="retry-load">Try again</button></div>`;
      $('#retry-load')?.addEventListener('click', () => refresh());
    } finally { setBusy(false); }
  }
  async function persist(input, version, message = 'Issue saved') {
    if (state.busy) return null;
    saveDraft(input, version);
    if (input.id) {
      const current = issueById(input.id);
      if (current) { state.issues = state.issues.map(issue => issue.id === input.id ? { ...issue, ...input } : issue); render(); }
    }
    setBusy(true); syncText('Saving…');
    try {
      const issue = await rpc('saveIssue', input, version);
      clearDraft(issue.id);
      state.issues = state.issues.some(i => i.id === issue.id) ? state.issues.map(i => i.id === issue.id ? issue : i) : [...state.issues, issue];
      $('#error-banner').hidden = true; syncText(isCloud ? 'Synced with Sheets' : 'Saved in this browser'); render(); notify(message); return issue;
    } catch (error) { showError(error); throw error; }
    finally { setBusy(false); }
  }
  async function createQuickTask(status = 'Backlog', sourceInput = null) {
    const input = sourceInput || $('#quick-title'), title = input.value.trim(), kind = input.dataset.quickKind || 'Task';
    if (!title || !state.ready) return;
    input.value = '';
    if (state.busy) { state.quickQueue.push({ title, status, kind }); syncText('Work item queued…'); return; }
    try { await persist({ summary: title, type: kind, taskTypeId: 'algo', status, priority: 'Medium' }, undefined, `${kind} added`); }
    catch (ignore) {}
    finally { if (!state.busy && state.quickQueue.length) { const next = state.quickQueue.shift(); input.value = next.title; input.dataset.quickKind = next.kind; createQuickTask(next.status, input); } }
  }
  function issueById(id) { return state.issues.find(i => i.id === id); }
  function inEpic(issue) {
    if (!state.epic) return true;
    let current = issue; const seen = new Set();
    while (current && !seen.has(current.id)) { if (current.id === state.epic) return true; seen.add(current.id); current = issueById(current.parentId); }
    return false;
  }
  function filtered() {
    const q = state.query.toLowerCase().trim();
    return C.sorted(state.issues.filter(i => (!state.type || i.type === state.type) && (!state.status || i.status === state.status) && (!state.sprint || i.sprint === state.sprint) && (!state.assignee || (state.assignee === '__unassigned' ? !i.assignee : i.assignee === state.assignee)) && inEpic(i) && (!q || [i.id, i.summary, i.description, i.assignee, i.labels, i.parentId, i.sprint].join(' ').toLowerCase().includes(q))));
  }
  function options(items, selected = '', empty = null) {
    return (empty === null ? '' : `<option value="">${escape(empty)}</option>`) + items.map(item => { const value = typeof item === 'string' ? item : item.value; const label = typeof item === 'string' ? item : item.label; return `<option value="${escape(value)}" ${value === selected ? 'selected' : ''}>${escape(label)}</option>`; }).join('');
  }
  function renderFilters() {
    $('#type-filter').innerHTML = options(C.types, state.type, 'All types');
    $('#status-filter').innerHTML = options(C.statuses, state.status, 'All statuses');
    const people = [...new Set(state.issues.map(i => i.assignee).filter(Boolean))].sort();
    const sprints = [...new Set(state.issues.map(i => i.sprint).filter(Boolean))].sort();
    if (state.assignee && state.assignee !== '__unassigned' && !people.includes(state.assignee)) people.push(state.assignee);
    if (state.sprint && !sprints.includes(state.sprint)) sprints.push(state.sprint);
    $('#assignee-filter').innerHTML = options([{ value: '__unassigned', label: 'Unassigned' }, ...people], state.assignee, 'Anyone');
    $('#sprint-filter').innerHTML = options(sprints, state.sprint, 'All sprints');
    $('#people').innerHTML = options(people); $('#sprints').innerHTML = options(sprints);
    $('#clear-filters').hidden = ![state.query, state.type, state.assignee, state.status, state.sprint, state.epic].some(Boolean);
    $('#filter-context').hidden = !state.epic;
    $('#filter-context').textContent = state.epic ? `Epic: ${issueById(state.epic)?.summary || state.epic} · Includes all child issues` : '';
  }
  function render() {
    if (!state.ready) return;
    renderFilters();
    $$('[data-view]').forEach(el => { const active = el.dataset.view === state.view; el.classList.toggle('active', active); if (el.getAttribute('role') === 'tab') { el.setAttribute('aria-selected', String(active)); el.setAttribute('aria-controls', 'view-content'); } });
    const issues = filtered(), done = issues.filter(i => i.status === 'Done').length;
    const progress = issues.length ? Math.round(done / issues.length * 100) : 0;
    const overdue = issues.filter(i => i.dueDate && i.dueDate < today() && i.status !== 'Done').length;
    $('#stats').innerHTML = [
      ['stack', 'Total issues', issues.length, `${issues.filter(i => i.type === 'Epic').length} epics`, ''],
      ['circle', 'In progress', issues.filter(i => i.status === 'In Progress').length, 'Making moves', ''],
      ['check', 'Completed', done, `${progress}% complete`, 'positive'],
      ['flag', 'Overdue', overdue, overdue ? 'Needs attention' : 'Right on track', overdue ? '' : 'positive']
    ].map(s => `<div class="stat"><div class="stat-label">${icon(s[0])}${s[1]}</div><div class="stat-bottom"><span class="stat-number">${s[2]}</span><span class="stat-note ${s[4]}">${s[3]}</span></div></div>`).join('');
    $('#epic-nav').innerHTML = state.issues.filter(i => i.type === 'Epic').map(i => `<button data-epic="${escape(i.id)}" class="${state.epic === i.id ? 'active' : ''}" title="${escape(i.summary)}"><span class="epic-dot"></span><span class="epic-name">${escape(i.summary)}</span></button>`).join('') || '<span class="nav-caption">No epics yet</span>';
    $('#issue-count').textContent = `${issues.length} of ${state.issues.length} issues`;
    $('#view-hint').textContent = { kanban: 'Drag cards to move work forward. Click a card for the details.', sheet: 'Edit a cell to save. Click an issue ID for the full story.', gantt: 'Drag to reschedule. Resize the right edge to change the due date.' }[state.view];
    if (!state.issues.length) { $('#view-content').innerHTML = `<div class="empty-state">${icon('stack')}<h2>A fresh start for your next project.</h2><p>Create your first epic, story, task, or bug.</p><button class="button primary" data-new="Backlog">Create your first issue</button></div>`; return; }
    if (!issues.length) { $('#view-content').innerHTML = '<div class="empty-state"><h2>No issues match these filters.</h2><p>Try a different search, or clear the filters to see everything.</p><button class="button secondary" data-clear>Clear filters</button></div>'; return; }
    const content = $('#view-content'), oldScroll = content.querySelector('.board, .table-wrap, .gantt-viewport');
    const scroll = oldScroll ? { left: oldScroll.scrollLeft, top: oldScroll.scrollTop } : null;
    if (state.view === 'kanban') renderBoard(issues);
    if (state.view === 'sheet') renderSheet(issues);
    if (state.view === 'gantt') renderGantt(issues);
    const nextScroll = content.querySelector('.board, .table-wrap, .gantt-viewport');
    if (scroll && nextScroll) { nextScroll.scrollLeft = scroll.left; nextScroll.scrollTop = scroll.top; }
  }
  function card(issue) {
    const prioritySymbol = ['Highest', 'High'].includes(issue.priority) ? '↑' : ['Low', 'Lowest'].includes(issue.priority) ? '↓' : '−';
    const priorityClass = C.priorities.includes(issue.priority) ? issue.priority.toLowerCase() : '';
    const parent = issueById(issue.parentId);
    const activity = { algo: 'Algo', data: 'Data', requirements: 'Requirements', bug: 'Bug' }[issue.taskTypeId] || issue.taskTypeId || 'General';
    return `<article class="card" draggable="true" tabindex="0" role="button" data-issue="${escape(issue.id)}" aria-label="${escape(issue.id + ': ' + issue.summary)}"><div class="card-top"><span class="card-id">${typeIcon(issue.type)}${escape(issue.id)}</span><span class="priority ${priorityClass}">${prioritySymbol} ${escape(issue.priority)}</span></div><h3 class="card-title">${escape(issue.summary)}</h3>${parent ? `<div class="card-parent" title="${escape(parent.summary)}">ϟ ${escape(parent.summary)}</div>` : ''}<div class="card-labels"><span class="label-tag activity-tag">${escape(activity)}</span>${C.split(issue.labels).slice(0, 2).map(label => `<span class="label-tag">${escape(label)}</span>`).join('')}</div><div class="card-footer"><span class="card-due ${issue.dueDate && issue.dueDate < today() && issue.status !== 'Done' ? 'overdue' : ''}">${icon(issue.status === 'Done' ? 'check' : 'calendar')}${issue.dueDate ? escape(shortDate(issue.dueDate)) : 'No due date'}</span>${avatar(issue.assignee)}</div></article>`;
  }
  function renderBoard(issues) {
    $('#view-content').innerHTML = `<div class="board">${C.statuses.map((status, index) => {
      const cards = issues.filter(i => i.status === status);
      return `<section class="column" data-status="${status}" aria-label="${status}" style="--status-color:${statusColors[index]}"><h2 class="column-header"><span class="status-dot"></span>${status}<span class="column-count">${cards.length}</span><button data-new="${status}" aria-label="Open full task editor for ${status}">+</button></h2><div class="card-list">${cards.map(card).join('') || '<div class="column-empty">A little room for what’s next</div>'}</div><div class="column-quick-add"><select data-quick-kind="${status}" aria-label="New work item kind"><option value="Task">Task</option><option value="Story">Story</option><option value="Epic">Epic</option></select><input data-quick-title="${status}" maxlength="250" placeholder="Add a task, story, or epic…" aria-label="Add task, story, or epic to ${status}"><button data-quick-add="${status}" aria-label="Add task, story, or epic to ${status}">＋</button></div></section>`;
    }).join('')}</div>`;
  }
  function renderSheet(issues) {
    const primary = ['id', 'type', 'parentId', 'summary', 'status', 'priority', 'assignee', 'startDate', 'dueDate', 'progress', 'estimate', 'sprint'];
    const columns = C.fields.filter(f => state.allColumns || primary.includes(f.key));
    columns.splice(Math.min(2, columns.length), 0, { key: 'taskTypeId', label: 'Activity Type', kind: 'text' });
    const list = issues.slice().sort((a, b) => { const x = a[state.sort], y = b[state.sort]; const order = typeof x === 'number' ? x - y : String(x).localeCompare(String(y), undefined, { numeric: true }); return order * (state.ascending ? 1 : -1); });
    $('#view-content').innerHTML = `<div class="sheet-tools"><span>Every detail, in one place.</span><label><input id="all-columns" type="checkbox" ${state.allColumns ? 'checked' : ''}> Show all ${C.fields.length} columns</label></div><div class="table-wrap"><table class="issue-table"><thead><tr>${columns.map(f => `<th><button data-sort="${f.key}">${escape(f.label)} ${state.sort === f.key ? (state.ascending ? '↑' : '↓') : ''}</button></th>`).join('')}</tr></thead><tbody>${list.map(issue => `<tr>${columns.map(f => `<td>${cell(issue, f)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  function cell(issue, field) {
    const key = field.key, value = issue[key];
    if (key === 'taskTypeId') { const labels = { algo: 'Algo', data: 'Data', requirements: 'Requirements', bug: 'Bug' }; return `<span class="label-tag">${escape(labels[value] || value || 'General')}</span>`; }
    if (key === 'id') return `<button class="issue-link" data-open="${escape(issue.id)}">${typeIcon(issue.type)}${escape(value)}</button>`;
    if (['createdAt', 'updatedAt', 'completedDate', 'rank'].includes(key)) return `<span class="cell-readonly" title="${escape(value)}">${escape(field.kind === 'timestamp' ? timestamp(value) : value || '—')}</span>`;
    const attr = `class="cell-input ${key === 'summary' ? 'cell-summary' : ''}" data-field="${key}" data-id="${escape(issue.id)}" aria-label="${escape(issue.id + ' ' + field.label)}"`;
    if (['type', 'status', 'priority'].includes(key)) return `<select ${attr}>${options({ type: C.types, status: C.statuses, priority: C.priorities }[key], value)}</select>`;
    if (key === 'parentId') return `<select ${attr}>${options(parentsFor(issue), value, 'No parent')}</select>`;
    return `<input ${attr} type="${field.kind === 'number' ? 'number' : field.kind === 'date' ? 'date' : 'text'}" ${field.kind === 'number' ? `min="0" step="${key === 'progress' ? '1' : '0.25'}" ${key === 'progress' ? 'max="100"' : ''}` : ''} ${field.kind === 'date' ? 'min="1900-01-01" max="2200-12-31"' : ''} ${key === 'summary' ? 'maxlength="250" required' : ''} value="${escape(value)}">`;
  }
  function parentsFor(issue) {
    return state.issues.filter(i => i.id !== issue.id && (issue.type === 'Story' ? i.type === 'Epic' : ['Task', 'Bug'].includes(issue.type) ? ['Epic', 'Story'].includes(i.type) : false)).map(i => ({ value: i.id, label: `${i.id} · ${i.summary}` }));
  }
  function renderGantt(issues) {
    const dayWidth = state.zoom === 'days' ? 38 : 24, days = state.zoom === 'days' ? 56 : 112;
    const start = state.timelineStart, end = C.addDays(start, days - 1), width = dayWidth * days;
    const positions = new Map();
    const rows = issues.map((issue, row) => {
      const scheduled = C.validDate(issue.startDate) && C.validDate(issue.dueDate) && issue.dueDate >= issue.startDate;
      const rawStart = scheduled ? C.dateNumber(issue.startDate) - C.dateNumber(start) : 0;
      const rawEnd = scheduled ? C.dateNumber(issue.dueDate) - C.dateNumber(start) + 1 : 0;
      const left = Math.max(0, rawStart) * dayWidth + 3, right = Math.min(days, rawEnd) * dayWidth - 3;
      const visible = scheduled && right > left;
      if (visible) positions.set(issue.id, { left, right, y: row * 45 + 22 });
      const index = C.statuses.indexOf(issue.status), colors = { Epic: ['#efe8f5', '#9675b1', '#e1d3ec'], Story: ['#edf3e4', '#718b57', '#dce8c8'], Task: ['#e9f0f5', '#698aa1', '#d3e3ec'], Bug: ['#f7ede6', '#ad826a', '#efddcf'] }[issue.type] || ['#edf3e4', '#718b57', '#dce8c8'];
      return `<div class="gantt-row"><button class="gantt-row-label" data-open="${escape(issue.id)}" title="${escape(issue.summary)}">${typeIcon(issue.type)}<span><strong>${escape(issue.id)}</strong>${escape(issue.summary)}</span></button><div class="gantt-track" style="width:${width}px;--day-width:${dayWidth}px">${visible ? `<button class="gantt-bar" data-bar="${escape(issue.id)}" data-day-width="${dayWidth}" data-full-start="${rawStart}" data-full-end="${rawEnd}" style="left:${left}px;width:${right - left}px;--bar-bg:${colors[0]};--bar-color:${colors[1]};--bar-border:${colors[2]};--bar-fill:${colors[2]}" title="${escape(`${issue.id}: ${issue.startDate} → ${issue.dueDate} · ${issue.progress}% · ${C.statuses[index]}`)}" aria-label="Edit schedule for ${escape(issue.id)}"><span class="bar-progress" style="width:${Math.max(0, Math.min(100, issue.progress))}%"></span><span class="bar-text">${escape(issue.summary)}</span>${rawEnd <= days ? '<span class="resize-handle" title="Drag to change due date"></span>' : ''}</button>` : `<button class="schedule-note" data-open="${escape(issue.id)}">${scheduled ? `Outside this window · ${shortDate(issue.startDate)} – ${shortDate(issue.dueDate)}` : 'Set start and due dates →'}</button>`}</div></div>`;
    }).join('');
    let links = '';
    issues.forEach(issue => C.split(issue.dependencies).forEach(id => {
      const from = positions.get(id), to = positions.get(issue.id); if (!from || !to) return;
      const turn = from.right + 12;
      links += `<path d="M${from.right},${from.y} H${turn} V${to.y} H${to.left}" fill="none" stroke="#aab99d" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>`;
    }));
    const todayOffset = C.dateNumber(today()) - C.dateNumber(start);
    $('#view-content').innerHTML = `<div class="gantt-tools"><div class="left"><button class="button secondary" data-timeline="-1" aria-label="Earlier dates">←</button><button class="button secondary" data-timeline="today">Today</button><button class="button secondary" data-timeline="1" aria-label="Later dates">→</button><input id="timeline-date" type="date" aria-label="Timeline start" value="${start}" min="1900-01-01" max="2200-01-01"></div><div class="right"><span>${shortDate(start)} – ${shortDate(end)} ${end.slice(0, 4)}</span><select id="timeline-zoom" aria-label="Timeline zoom">${options(['weeks', 'days'], state.zoom)}</select></div></div><div class="gantt-viewport"><div class="gantt-grid"><div class="gantt-header"><div class="gantt-label-head">ISSUE / TIMELINE</div><div class="gantt-dates">${Array.from({ length: days }, (_, n) => { const value = C.addDays(start, n), d = new Date(value + 'T12:00:00Z'); return `<div class="gantt-date ${[0, 6].includes(d.getUTCDay()) ? 'weekend' : ''} ${value === today() ? 'today' : ''}" style="width:${dayWidth}px" title="${value}">${d.getUTCDate() === 1 || n === 0 ? d.toLocaleDateString('en', { month: 'short', timeZone: 'UTC' }) : d.toLocaleDateString('en', { weekday: 'narrow', timeZone: 'UTC' })}<strong>${d.getUTCDate()}</strong></div>`; }).join('')}</div></div>${rows}<svg class="timeline-links" width="${width}" height="${issues.length * 45}" aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="none" stroke="#aab99d"/></marker></defs>${links}</svg>${todayOffset >= 0 && todayOffset < days ? `<div class="today-line" style="left:calc(var(--label-width,260px) + ${todayOffset * dayWidth + dayWidth / 2}px)"></div>` : ''}</div></div><div class="gantt-legend">${C.types.map(t => `<span><i style="background:${typeColors[t]}"></i>${t}</span>`).join('')}<span>┄ Dependency</span><span>Shaded bar = progress</span></div>`;
  }
  function formSnapshot() { return JSON.stringify([...new FormData(form).entries()]); }
  function openIssue(id = '', defaults = {}) {
    if (state.busy || !state.ready) return;
    const original = id ? issueById(id) : null;
    if (id && !original) return;
    edited = original ? { ...original } : null;
    const issue = { ...C.blank(), ...(original || defaults) };
    $('#dialog-id').textContent = id || 'NEW ISSUE'; $('#dialog-title').textContent = id ? 'A little more detail.' : 'Make the next move.';
    form.elements.type.innerHTML = options(C.types, issue.type);
    form.elements.taskTypeId.innerHTML = options(activityTypes(), issue.taskTypeId || 'algo');
    form.elements.status.innerHTML = options(C.statuses, issue.status);
    form.elements.priority.innerHTML = options(C.priorities, issue.priority);
    form.elements.parentId.innerHTML = options(parentsFor(issue), issue.parentId, 'No parent');
    for (const field of C.fields) if (form.elements[field.key]) form.elements[field.key].value = issue[field.key];
    $('#form-error').hidden = true; $('#delete-issue').hidden = !id;
    $('#issue-metadata').innerHTML = id ? `Created ${escape(timestamp(issue.createdAt))}<br>Updated ${escape(timestamp(issue.updatedAt))}${issue.completedDate ? `<br>Completed ${escape(shortDate(issue.completedDate))}` : ''}` : '';
    const children = state.issues.filter(i => i.parentId === id && id);
    $('#child-issues').innerHTML = children.length ? `<h3 class="child-heading">Child issues (${children.length})</h3>${children.map(i => `<button type="button" class="child-link" data-child="${escape(i.id)}">${typeIcon(i.type)}<strong>${escape(i.id)}</strong> ${escape(i.summary)}</button>`).join('')}` : '';
    initialForm = formSnapshot(); if (!dialog.open) dialog.showModal(); form.elements.summary.focus();
  }
  function closeIssue() {
    if (state.busy) return false;
    if (formSnapshot() !== initialForm && !confirm('Discard your unsaved changes?')) return false;
    dialog.close(); edited = null; return true;
  }
  async function saveForm(event) {
    event.preventDefault(); if (state.busy || !form.reportValidity()) return;
    const data = Object.fromEntries(new FormData(form));
    if (edited) data.id = edited.id;
    try {
      C.validate(C.prepare(data, edited, today(), new Date().toISOString()), state.issues);
      const saved = await persist(data, edited?.version);
      if (saved) { dialog.close(); edited = null; }
    } catch (error) { $('#form-error').textContent = error.message; $('#form-error').hidden = false; $('#form-error').scrollIntoView({ block: 'nearest' }); }
  }
  function clearFilters() {
    ['query', 'type', 'assignee', 'status', 'sprint', 'epic'].forEach(key => state[key] = ''); $('#search').value = ''; render();
  }
  function setView(view) {
    if (!['sheet', 'kanban', 'gantt'].includes(view)) view = 'kanban';
    state.view = view; if (location.hash !== '#' + view) location.hash = view; render();
  }
  $$('[data-view]').forEach(el => el.addEventListener('click', () => setView(el.dataset.view)));
  window.addEventListener('hashchange', () => setView(location.hash.slice(1)));
  $('#create-issue').addEventListener('click', () => openIssue());
  $('#quick-add').addEventListener('click', createQuickTask);
  $('#quick-title').addEventListener('keydown', event => { if (event.key === 'Enter') { event.preventDefault(); createQuickTask(); } });
  $('#add-epic').addEventListener('click', () => openIssue('', { type: 'Epic' }));
  $('#refresh').addEventListener('click', () => refresh());
  $('#search').addEventListener('input', event => { state.query = event.target.value; render(); });
  for (const key of ['type', 'assignee', 'status', 'sprint']) $(`#${key}-filter`).addEventListener('change', event => { state[key] = event.target.value; render(); });
  $('#clear-filters').addEventListener('click', clearFilters);
  $('#epic-nav').addEventListener('click', event => { const target = event.target.closest('[data-epic]'); if (target) { state.epic = state.epic === target.dataset.epic ? '' : target.dataset.epic; render(); } });
  $('#export').addEventListener('click', () => {
    if (!state.ready) return;
    const url = URL.createObjectURL(new Blob([C.csv(filtered())], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = `sheetflow-issues-${today()}.csv`; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
  $('#close-dialog').addEventListener('click', closeIssue); $('#cancel-dialog').addEventListener('click', closeIssue);
  dialog.addEventListener('cancel', event => { event.preventDefault(); closeIssue(); });
  form.addEventListener('submit', saveForm);
  form.elements.type.addEventListener('change', () => {
    const selected = form.elements.parentId.value;
    form.elements.parentId.innerHTML = options(parentsFor({ id: edited?.id, type: form.elements.type.value }), selected, 'No parent');
  });
  form.elements.status.addEventListener('change', () => { if (form.elements.status.value === 'Done') form.elements.progress.value = 100; else if (edited?.status === 'Done' && form.elements.progress.value === '100') form.elements.progress.value = 0; });
  $('#child-issues').addEventListener('click', event => { const target = event.target.closest('[data-child]'); if (target && closeIssue()) openIssue(target.dataset.child); });
  $('#delete-issue').addEventListener('click', async () => {
    if (!edited || state.busy) return;
    try { C.canDelete(edited.id, state.issues); } catch (error) { $('#form-error').textContent = error.message; $('#form-error').hidden = false; return; }
    if (!confirm(`Delete ${edited.id}: ${edited.summary}? This cannot be undone.`)) return;
    setBusy(true); syncText('Deleting…');
    try { await rpc('deleteIssue', edited.id, edited.version); state.issues = state.issues.filter(i => i.id !== edited.id); dialog.close(); edited = null; render(); syncText(isCloud ? 'Synced with Sheets' : 'Saved in this browser'); notify('Issue deleted'); }
    catch (error) { showError(error); $('#form-error').textContent = error.message; $('#form-error').hidden = false; }
    finally { setBusy(false); }
  });
  $('#help-button').addEventListener('click', () => {
    $('#help-storage').textContent = isCloud ? 'Edits save to the connected Google Sheet. The app checks for updates every 45 seconds while you are browsing. Use Refresh to get changes sooner. Keep sheet headers and issue IDs unchanged.' : 'This is a standalone demo. Data is saved only in this browser; it is not shared across people or devices. Deploy the Apps Script project for Google Sheets storage and collaboration.';
    $('#help-dialog').showModal();
  });
  $('#close-help').addEventListener('click', () => $('#help-dialog').close());
  $('#view-content').addEventListener('click', event => {
    if (state.busy || Date.now() < suppressClickUntil) return;
    const target = event.target.closest('[data-open], [data-issue], [data-new], [data-quick-add], [data-clear], [data-sort], [data-timeline], [data-bar]');
    if (!target) return;
    if (target.hasAttribute('data-quick-add')) { const input = target.parentElement.querySelector('[data-quick-title]'); input.dataset.quickKind = target.parentElement.querySelector('[data-quick-kind]').value; createQuickTask(target.dataset.quickAdd, input); }
    else if (target.hasAttribute('data-new')) openIssue('', { status: target.dataset.new, parentId: state.epic });
    else if (target.hasAttribute('data-clear')) clearFilters();
    else if (target.hasAttribute('data-sort')) { state.ascending = state.sort === target.dataset.sort ? !state.ascending : true; state.sort = target.dataset.sort; render(); }
    else if (target.hasAttribute('data-timeline')) {
      const next = target.dataset.timeline === 'today' ? C.addDays(today(), -7) : C.addDays(state.timelineStart, Number(target.dataset.timeline) * 28);
      if (C.validDate(next) && next <= '2200-01-01') { state.timelineStart = next; render(); }
    } else openIssue(target.dataset.open || target.dataset.issue || target.dataset.bar);
  });
  $('#view-content').addEventListener('keydown', event => { if (event.target.matches('.column-quick-add input') && event.key === 'Enter') { event.preventDefault(); event.target.dataset.quickKind = event.target.parentElement.querySelector('[data-quick-kind]').value; createQuickTask(event.target.dataset.quickTitle, event.target); } else if (event.target.matches('.card') && ['Enter', ' '].includes(event.key)) { event.preventDefault(); openIssue(event.target.dataset.issue); } });
  $('#view-content').addEventListener('change', async event => {
    const target = event.target;
    if (target.id === 'all-columns') { state.allColumns = target.checked; render(); return; }
    if (target.id === 'timeline-date') { if (C.validDate(target.value) && target.checkValidity()) { state.timelineStart = target.value; render(); } return; }
    if (target.id === 'timeline-zoom') { state.zoom = target.value; render(); return; }
    if (!target.dataset.field || state.busy) return;
    const issue = issueById(target.dataset.id); if (!issue) return;
    if (!target.checkValidity()) { target.reportValidity(); return; }
    try { await persist({ ...issue, [target.dataset.field]: target.value }, issue.version); }
    catch (error) { render(); notify(error.message, true); }
  });
  $('#view-content').addEventListener('dragstart', event => {
    const card = event.target.closest('.card'); if (!card || state.busy) { event.preventDefault(); return; }
    draggingId = card.dataset.issue; event.dataTransfer.setData('text/plain', draggingId); event.dataTransfer.effectAllowed = 'move'; card.classList.add('dragging');
  });
  function clearDragStyle() { $$('.drag-over, .drop-before, .dragging').forEach(el => el.classList.remove('drag-over', 'drop-before', 'dragging')); }
  $('#view-content').addEventListener('dragover', event => {
    const column = event.target.closest('.column'); if (!column || !draggingId || state.busy) return;
    event.preventDefault(); event.dataTransfer.dropEffect = 'move';
    $$('.drag-over, .drop-before').forEach(el => el.classList.remove('drag-over', 'drop-before'));
    column.classList.add('drag-over'); const card = event.target.closest('.card'); if (card && card.dataset.issue !== draggingId) card.classList.add('drop-before');
  });
  $('#view-content').addEventListener('dragend', () => { draggingId = null; clearDragStyle(); });
  $('#view-content').addEventListener('drop', async event => {
    const column = event.target.closest('.column'); if (!column || !draggingId || state.busy) return;
    event.preventDefault(); const id = draggingId, issue = issueById(id); draggingId = null;
    const target = event.target.closest('.card'); clearDragStyle();
    if (!issue || target?.dataset.issue === id) return;
    const neighbors = C.sorted(state.issues.filter(i => i.status === column.dataset.status && i.id !== id));
    const targetIndex = target ? neighbors.findIndex(i => i.id === target.dataset.issue) : -1;
    let rank;
    if (targetIndex >= 0) rank = (neighbors[targetIndex].rank + (targetIndex ? neighbors[targetIndex - 1].rank : 0)) / 2;
    else rank = (neighbors.at(-1)?.rank || 0) + 1000;
    try { await persist({ ...issue, status: column.dataset.status, rank }, issue.version, 'Board updated'); }
    catch (error) { notify(error.message, true); }
  });
  $('#view-content').addEventListener('pointerdown', event => {
    const bar = event.target.closest('[data-bar]'); if (!bar || event.button !== 0 || state.busy) return;
    const issue = issueById(bar.dataset.bar); if (!issue) return;
    timelineDrag = { bar, issue: { ...issue }, x: event.clientX, width: bar.offsetWidth, left: parseFloat(bar.style.left), days: 0, resize: event.target.classList.contains('resize-handle'), moved: false, pointer: event.pointerId };
    bar.setPointerCapture(event.pointerId);
  });
  $('#view-content').addEventListener('pointermove', event => {
    if (!timelineDrag || event.pointerId !== timelineDrag.pointer) return;
    const d = timelineDrag, dayWidth = Number(d.bar.dataset.dayWidth);
    let days = Math.round((event.clientX - d.x) / dayWidth);
    if (d.resize) days = Math.max(days, C.dateNumber(d.issue.startDate) - C.dateNumber(d.issue.dueDate));
    d.days = days; if (Math.abs(event.clientX - d.x) > 4) d.moved = true;
    if (d.resize) d.bar.style.width = Math.max(8, d.width + days * dayWidth) + 'px';
    else d.bar.style.transform = `translateX(${days * dayWidth}px)`;
    if (d.moved) d.bar.title = `${d.resize ? d.issue.startDate : C.addDays(d.issue.startDate, days)} → ${C.addDays(d.issue.dueDate, days)}`;
  });
  async function endTimeline(event, cancel = false) {
    if (!timelineDrag || event.pointerId !== timelineDrag.pointer) return;
    const d = timelineDrag; timelineDrag = null;
    if (d.bar.hasPointerCapture(event.pointerId)) d.bar.releasePointerCapture(event.pointerId);
    if (d.moved) suppressClickUntil = Date.now() + 400;
    if (cancel || !d.days) { d.bar.style.transform = ''; d.bar.style.width = d.width + 'px'; return; }
    try { await persist({ ...d.issue, startDate: d.resize ? d.issue.startDate : C.addDays(d.issue.startDate, d.days), dueDate: C.addDays(d.issue.dueDate, d.days) }, d.issue.version, 'Schedule updated'); }
    catch (error) { render(); notify(error.message, true); }
  }
  $('#view-content').addEventListener('pointerup', event => endTimeline(event));
  $('#view-content').addEventListener('pointercancel', event => endTimeline(event, true));
  document.addEventListener('keydown', event => {
    if (event.ctrlKey || event.metaKey || event.altKey || event.target.matches('input,textarea,select') || $('dialog[open]')) return;
    if (event.key === '/') { event.preventDefault(); $('#search').focus(); }
    else if (event.key.toLowerCase() === 'n') openIssue();
    else if (['1', '2', '3'].includes(event.key)) setView(['sheet', 'kanban', 'gantt'][Number(event.key) - 1]);
  });
  window.addEventListener('beforeunload', event => { if (state.busy || (dialog.open && formSnapshot() !== initialForm)) { event.preventDefault(); event.returnValue = ''; } });
  window.addEventListener('storage', event => { if (event.key === storageKey && !state.busy && !dialog.open) refresh(true); });
  setInterval(() => { if (isCloud && !document.hidden && !dialog.open && !state.busy && !document.activeElement?.matches('.cell-input')) refresh(true); }, 45000);
  const requestedView = location.hash.slice(1) || new URLSearchParams(location.search).get('view') || document.body.dataset.initialView;
  state.view = ['sheet', 'kanban', 'gantt'].includes(requestedView) ? requestedView : 'kanban';
  refresh();
})();
</script>
